<!DOCTYPE html>

<head>

<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  .tit { font-size: 103px; line-height: 1.05; font-weight: 600; letter-spacing: -0.04em; }

  .boleto { position: absolute; right: 84px; top: 78px; display: flex; align-items: center; gap: 12px; font-size: 31px; font-weight: 500;
