<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Descargar Etude ENARM</title>
<meta name="description" content="Descarga Etude ENARM en App Store o Google Play.">
<meta property="og:title" content="Descargar Etude ENARM">
<meta property="og:description" content="El simulador de casos clínicos para el ENARM. Disponible en iPhone y Android.">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="assets/logo-e-ink.png">
<style>
  :root{
    --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",system-ui,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:radial-gradient(120% 85% at 50% 0%, rgba(255,255,255,.06) 0%, transparent 55%), #08080B;
    font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 24px;
  }
  .wrap{text-align:center;max-width:400px;width:100%;}
  .marca{display:inline-flex;align-items:center;gap:11px;margin-bottom:36px;}
  .marca img{height:30px;width:auto;display:block;}
  .marca span{color:#fff;font-size:18px;font-weight:600;letter-spacing:.2px;}
  h1{color:#fff;font-size:27px;line-height:1.16;font-weight:700;letter-spacing:-.9px;margin-bottom:14px;}
  .sub{color:rgba(255,255,255,.55);font-size:15.5px;line-height:1.6;margin-bottom:34px;}
  .botones{display:flex;flex-direction:column;gap:11px;}
  .btn{
    background:#fff;color:#0B0B0F;font-size:15px;font-weight:600;
    padding:16px 26px;border-radius:999px;text-decoration:none;
    display:block;transition:opacity .15s ease-out,transform .15s ease-out;
  }
  .btn:active{transform:scale(.97);}
  .pie{color:rgba(255,255,255,.38);font-size:13px;line-height:1.6;margin-top:28px;}
  .pie a{color:rgba(255,255,255,.55);text-decoration:none;}
  @media(hover:hover) and (pointer:fine){
    .btn:hover{opacity:.85;}
    .pie a:hover{color:#fff;}
  }
  @media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;}}
</style>
</head>
<body>

<div class="wrap">
  <div class="marca">
    <img src="assets/logo-e-white.png" alt="">
    <span>Etude <b style="font-weight:700;letter-spacing:-.1px;">ENARM</b></span>
  </div>

  <h1 data-titulo>Descarga Etude ENARM</h1>
  <p class="sub" data-sub>Elige tu tienda para instalar la app.</p>

  <div class="botones">
    <a class="btn" data-tienda="ios" href="https://apps.apple.com/mx/app/etude-enarm/id6759030566">Descargar para iPhone</a>
    <a class="btn" data-tienda="android" href="https://play.google.com/store/apps/details?id=com.etudeenarm.app">Descargar para Android</a>
  </div>

  <p class="pie">Más de 1,000 preguntas · Gratis las primeras 20<br><a href="/">Conoce Etude ENARM</a></p>
</div>

<script src="assets/medicion.js"></script>
<script>
(function(){
  'use strict';

  var APPLE_PT = (window.ETUDE_MEDICION && window.ETUDE_MEDICION.APPLE_PT) || '';

  var IOS = 'https://apps.apple.com/mx/app/etude-enarm/id6759030566';
  var ANDROID = 'https://play.google.com/store/apps/details?id=com.etudeenarm.app';

  // ── Etiquetas de campaña: /descargar?c=nombre&f=fuente ──
  // "c" es la campaña (ej. meta-retargeting); "f" la fuente (default: etude).
  // Con "c" presente, el enlace de cada tienda sale etiquetado y la descarga
  // queda clasificada en App Store Connect (Campañas) y Play Console (UTM).
  var params = new URLSearchParams(location.search);
  var campana = (params.get('c') || '').replace(/[^\w-]/g, '').slice(0, 60);
  var fuente = (params.get('f') || 'etude').replace(/[^\w-]/g, '').slice(0, 40);

  if (campana) {
    if (APPLE_PT) {
      IOS += '?pt=' + APPLE_PT + '&ct=' + encodeURIComponent(campana) + '&mt=8';
    }
    ANDROID += '&referrer=' + encodeURIComponent(
      'utm_source=' + fuente + '&utm_medium=link&utm_campaign=' + campana
    );
  }
  document.querySelector('[data-tienda="ios"]').href = IOS;
  document.querySelector('[data-tienda="android"]').href = ANDROID;

  // El Pixel (si hay ID) ya quedó iniciado por assets/medicion.js.
  var hayPixel = typeof window.fbq === 'function';

  function marcaTienda(plataforma) {
    if (!hayPixel) return;
    try {
      fbq('trackCustom', 'ClickTienda', { plataforma: plataforma, campana: campana || 'organico' });
    } catch(e){}
  }

  document.querySelector('[data-tienda="ios"]').addEventListener('click', function(){ marcaTienda('ios'); });
  document.querySelector('[data-tienda="android"]').addEventListener('click', function(){ marcaTienda('android'); });

  // ── Redirección automática a la tienda del dispositivo. ──
  var ua = navigator.userAgent || '';
  var esAndroid = /android/i.test(ua);
  // iPadOS se anuncia como Macintosh; maxTouchPoints lo delata.
  var esIOS = /iphone|ipad|ipod/i.test(ua) ||
              (/macintosh/i.test(ua) && navigator.maxTouchPoints > 1);

  // ?t=ios | ?t=android fuerza la tienda: lo usan los botones de la landing,
  // donde la persona ya eligió plataforma y no se le debe corregir el destino.
  var forzada = params.get('t');
  if (forzada === 'ios' || forzada === 'android') {
    esAndroid = forzada === 'android';
    esIOS = !esAndroid;
  }

  var destino = esAndroid ? ANDROID : (esIOS ? IOS : null);

  // ?ver deja ver la página sin que redirija (para revisarla desde el celular).
  var soloVer = params.has('ver');

  // Si ya redirigimos en esta pestaña, no lo repetimos: quien vuelve aquí
  // es porque quiere elegir a mano. Una tienda forzada sí se respeta siempre:
  // viene de un clic deliberado, no de una redirección que se repite sola.
  var yaFue = false;
  try { yaFue = sessionStorage.getItem('etude-descarga') === '1'; } catch(e){}
  if (forzada) yaFue = false;

  if (destino && !soloVer && !yaFue) {
    try { sessionStorage.setItem('etude-descarga', '1'); } catch(e){}

    document.querySelector('[data-titulo]').textContent = 'Abriendo la tienda…';
    document.querySelector('[data-sub]').textContent =
      esAndroid ? 'Si no abre sola, toca “Descargar para Android”.'
                : 'Si no abre sola, toca “Descargar para iPhone”.';

    marcaTienda(esAndroid ? 'android' : 'ios');

    // replace() y no href: así el botón “atrás” no cae de nuevo en esta página.
    // Con Pixel activo se espera un instante para que el evento alcance a salir.
    if (hayPixel) {
      setTimeout(function(){ location.replace(destino); }, 250);
    } else {
      location.replace(destino);
    }
  }
})();
</script>

</body>
</html>
