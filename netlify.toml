# Configuración de despliegue para Netlify.
# Le dice a Netlify qué carpeta publicar y dónde vivirán las funciones.

[build]
  # Tu sitio (index.html, etc.) está dentro de la subcarpeta "site".
  publish = "site"

  # Aquí vivirá el autoresponder cuando lo construyamos (aún no existe, no pasa nada).
  functions = "netlify/functions"

# La URL corta que va en las historias de Instagram y en la bio.
# Sirve descargar.html sin el ".html" (status 200 = reescritura, no redirección).
[[redirects]]
  from = "/descargar"
  to = "/descargar.html"
  status = 200

# El enlace de la bio de Instagram: corto y sin parámetros a la vista.
# Tiene que ser 302 y no 200: la etiqueta viaja en la URL, y una reescritura
# dejaría "/app" en la barra, sin nada que leer para clasificar la descarga.
[[redirects]]
  from = "/app"
  to = "/descargar?c=bio-instagram"
  status = 302

# El enlace de las historias de Instagram (la fija y las del día a día).
# Misma mecánica que /app: 302 para que la etiqueta llegue a /descargar.
[[redirects]]
  from = "/historias"
  to = "/descargar?c=historias"
  status = 302

# La página de la cuenta: la abren los correos de «Confirma tu correo» y
# «Restablece tu contraseña» que manda la app (función enviarCorreoCuenta, en
# Etude CC-FF/herramientas/correos-cuenta/). 200 = reescritura: la barra
# conserva /cuenta y el código del enlace (?mode=…&oobCode=…) llega intacto.
[[redirects]]
  from = "/cuenta"
  to = "/cuenta.html"
  status = 200
